name: GLES1 translator checks

on:
  push:
    branches: ["trunk"]
    paths:
      - "src/gles/gles1_on_gles2.rs"
      - "src/gles/gles_generic.rs"
      - "src/frameworks/opengles/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gles1_translator.yml"
  pull_request:
    branches: ["trunk"]
    paths:
      - "src/gles/gles1_on_gles2.rs"
      - "src/gles/gles_generic.rs"
      - "src/frameworks/opengles/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gles1_translator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gles1-translator-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C link-arg=-latomic"

jobs:
  translator:
    name: GLES1-on-GLES2 build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config cmake \
            libasound2-dev libpulse-dev libsndio-dev libdbus-1-dev \
            libudev-dev libx11-dev libxext-dev libxcursor-dev libxi-dev \
            libxrandr-dev libxss-dev libxxf86vm-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libgl1-mesa-dev libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check

      - name: Run unit tests
        run: cargo test --lib -- --skip test_app
