name: Rust check and unit tests

# Fast feedback CI: formatting, `cargo check` and the self-test suite on the
# same runners the release workflow uses. This catches compile errors and
# `no_duplicate_*` self-test failures before a release build is attempted.

on:
  workflow_dispatch:
  pull_request:
    branches: [ "trunk" ]
  push:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    steps:
      - name: Checkout HyperHLE
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v4
        with:
          path: vendor/boost
          key: boost_1_81_0_${{ runner.os }}

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        shell: bash
        run: |
          curl -L -o boost.tar.gz "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"
          mkdir -p vendor
          tar xzf boost.tar.gz -C vendor
          mv vendor/boost_1_81_0 vendor/boost

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libstdc++-14-dev libsndio-dev \
            libpulse-dev libasound2-dev cmake

      - name: Check formatting
        shell: bash
        run: cargo fmt --check || echo "::warning::Formatting differences found"

      - name: cargo check (workspace, all targets)
        shell: bash
        run: cargo check --workspace --all-targets

      - name: Run unit tests
        shell: bash
        run: cargo test --workspace --lib